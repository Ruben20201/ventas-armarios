HTML
{% extends "base.html" %}
{% block content %}
<h2>Gestión de Armarios y Stock (Fábrica)</h2>

<div class="row mt-4">
    <!-- Formulario para Agregar Nuevo Armario -->
    <div class="col-md-4 mb-4">
        <div class="card shadow">
            <div class="card-header bg-dark text-white">Agregar Nuevo Armario</div>
            <div class="card-body">
              <form action="{{ url_for('gestionar_muebles') }}" method="POST" enctype="multipart/form-data">
                    
                    <div class="mb-2">
                        <label class="form-label">Nombre del Modelo</label>
                        <input type="text" name="nombre" class="form-control" required>
                    </div>

                    <div class="mb-2">
                        <label class="form-label">Descripción</label>
                        <textarea name="descripcion" class="form-control" rows="2"></textarea>
                    </div>

                    <div class="mb-2">
                        <label class="form-label">Precio ($)</label>
                        <input type="number" step="0.01" name="precio" class="form-control" required>
                    </div>

                    <div class="mb-2">
                        <label class="form-label">Stock Inicial</label>
                        <input type="number" name="stock" class="form-control" required>
                    </div>

                    <!-- Selector de Ubicación -->
                    <div class="mb-2">
                        <label for="ubicacion" class="form-label">Ubicación Inicial</label>
                        <select class="form-control" id="ubicacion" name="ubicacion" required>
                            <option value="Fábrica" selected>Fábrica</option>
                            <option value="Local">Local</option>
                        </select>
                    </div>

                    <!-- Selector de Imágenes Precargadas de Cloudinary con Miniatura -->
                    <div class="mb-3">
                         <label for="imagen_catalogo" class="form-label">Seleccionar imagen de Cloudinary:</label>
                         <select name="imagen_catalogo" id="imagen_catalogo" class="form-select" onchange="mostrarMiniatura(this)">
                          <option value="">-- Elige una imagen precargada --</option>
                          <option value="https://res.cloudinary.com/ljsxuy3b/image/upload/v1794069478/armarios_inventario/aaiwxzc4aeqsuudjw2jm.jpg">Armario Clásico Marrón</option>
                          <option value="https://res.cloudinary.com/ljsxuy3b/image/upload/v1794072418/IMG_20210521_163146.jpg">Armario Moderno Blanco</option>
                          <option value="https://res.cloudinary.com/ljsxuy3b/image/upload/v1794071912/armarios_inventario/bdukczy6qnvq16dyodpk.jpg">Armario Juvenil con Espejo</option>
                        </select>
    
                        <!-- Contenedor donde aparecerá la miniatura en tiempo real -->
                      <div class="mt-2 text-center">
                           <img id="preview_imagen" src="" alt="Vista previa" class="img-thumbnail d-none" style="max-height: 120px;">
                     </div>
                      </div>

                    <!-- Script mejorado para manejar la vista previa -->
<script>
function mostrarMiniatura(select) {
    var urlImagen = select.value;
    var preview = document.getElementById('preview_imagen');
    
    if (urlImagen && urlImagen !== "") {
        preview.src = urlImagen;
        preview.classList.remove('d-none'); // Muestra la imagen
    } else {
        preview.src = '';
        preview.classList.add('d-none'); // Oculta si no hay selección
    }
}
</script>
                    
                    <button type="submit" class="btn btn-primary w-100">Guardar Mueble</button>

                </form>
            </div>
        </div>
    </div>

    <!-- Tabla de Inventario Actual y Actualización de Stock -->
    <div class="col-md-8">
        <div class="card shadow">
            <div class="card-header bg-dark text-white">Inventario Actual</div>
            <div class="card-body">
               <table class="table align-middle">
                 <thead>
                     <tr>
                         <th>Modelo</th>
                         <th>Precio</th>
                         <th>Stock</th>
                         <th>Actualizar Stock</th>
                         <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                   {% for mueble in muebles %}
                   <tr>
                     <td>{{ mueble.nombre }}</td>
                     <td>${{ mueble.precio }}</td>
                     <td>{{ mueble.stock }}</td>
                     <td>
                      <form method="POST" action="{{ url_for('actualizar_stock', id=mueble.id) }}" class="d-flex gap-2">
                      <input type="number" name="stock" value="{{ mueble.stock }}" class="form-control form-control-sm" style="width: 80px;">
                      <button type="submit" class="btn btn-sm btn-warning">Actualizar</button>
                      </form>
                     </td>
                     <td>
                          <form action="{{ url_for('eliminar_mueble', id=mueble.id) }}" method="POST" onsubmit="return confirm('¿Estás seguro de que deseas eliminar este mueble?');" style="display:inline;">
                            <button type="submit" class="btn btn-sm btn-danger">🗑️ Eliminar</button>
                          </form>
                     </td>
                    </tr>
                    {% endfor %}
                  </tbody>
              </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}
